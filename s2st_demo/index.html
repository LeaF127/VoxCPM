<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>端到端语音翻译演示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            margin-bottom: 20px;
        }

        /* 配置区域 */
        .config-section {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .config-section h3 {
            font-size: 14px;
            color: #555;
            margin-bottom: 12px;
        }

        .config-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }

        .form-group input {
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        /* 输入方式选择 */
        .input-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-tab {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            background: white;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            color: #666;
            transition: all 0.2s;
        }

        .input-tab:hover {
            border-color: #667eea;
        }

        .input-tab.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .input-panel {
            display: none;
            padding: 25px;
            background: #fafafa;
            border-radius: 8px;
            text-align: center;
        }

        .input-panel.active {
            display: block;
        }

        /* 按钮样式 */
        .btn {
            padding: 14px 35px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin: 5px;
        }

        .btn-primary {
            background: #667eea;
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #f44336;
            color: white;
        }

        .btn-danger:hover:not(:disabled) {
            background: #d32f2f;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        /* 状态显示 */
        .status {
            margin: 15px 0;
            padding: 12px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .status.idle {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status.recording {
            background: #ffebee;
            color: #c62828;
            animation: pulse 1.5s infinite;
        }

        .status.processing {
            background: #fff3e0;
            color: #ef6c00;
        }

        .status.playing {
            background: #e3f2fd;
            color: #1565c0;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* 文件上传 */
        .file-upload {
            display: block;
            border: 2px dashed #ddd;
            border-radius: 8px;
            padding: 35px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .file-upload:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .file-upload.drag-over {
            border-color: #667eea;
            background: #f0f4ff;
            border-style: solid;
            transform: scale(1.02);
        }

        .file-upload input {
            display: none;
        }

        .file-info {
            margin-top: 12px;
            font-size: 14px;
            color: #666;
        }

        /* 结果展示 - 主区域 */
        .result-section {
            margin-top: 20px;
        }

        .result-section h2 {
            font-size: 16px;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #667eea;
        }

        .result-card {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 15px;
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 主演示结果（音频播放） */
        .main-result {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
        }

        .main-result h3 {
            font-size: 18px;
            margin-bottom: 15px;
        }

        .audio-player-container {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-top: 15px;
        }

        audio {
            width: 100%;
            height: 45px;
        }

        /* 文本结果（可选） */
        .text-result {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .text-item {
            padding: 12px 15px;
            background: white;
            border-radius: 6px;
            border-left: 4px solid #667eea;
        }

        .text-label {
            font-size: 12px;
            color: #999;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .text-content {
            font-size: 15px;
            color: #333;
            line-height: 1.5;
        }

        .text-item.source {
            border-left-color: #95a5a6;
        }

        .text-item.target {
            border-left-color: #667eea;
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: #999;
        }

        .empty-state svg {
            width: 60px;
            height: 60px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        /* 错误消息 */
        .error-message {
            background: #ffebee;
            border-left: 4px solid #f44336;
            padding: 12px 15px;
            margin-bottom: 15px;
            border-radius: 6px;
            color: #c62828;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* 录音指示器 */
        .recording-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #f44336;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>端到端语音翻译</h1>
            <p>说话 → 听到翻译后的语音（无需文本中转）</p>
        </div>

        <!-- 主卡片 -->
        <div class="card">
            <!-- 配置加载状态 -->
            <div id="configLoading" style="text-align: center; padding: 20px; color: #666;">
                正在加载配置...
            </div>

            <div id="mainContent" style="display: none;">
            <!-- 输入方式选择 -->
            <div class="input-tabs">
                <div class="input-tab active" data-tab="mic">麦克风录音</div>
                <div class="input-tab" data-tab="file">文件上传</div>
            </div>

            <!-- 麦克风录音面板 -->
            <div class="input-panel active" id="micPanel">
                <button class="btn btn-primary" id="startRecordBtn">开始录音</button>
                <button class="btn btn-danger" id="stopRecordBtn" disabled>停止录音</button>
                <div class="status idle" id="recordStatus">
                    <span>准备就绪</span>
                </div>
            </div>

            <!-- 文件上传面板 -->
            <div class="input-panel" id="filePanel">
                <label class="file-upload">
                    <input type="file" id="audioFileInput" accept="audio/*">
                    <div style="font-size: 16px; margin-bottom: 8px;">📁 点击或拖拽音频文件到此处</div>
                    <div style="font-size: 13px; color: #999;">支持 WAV, MP3, WebM 等格式</div>
                    <div class="file-info" id="fileInfo"></div>
                </label>
                <button class="btn btn-primary" id="uploadBtn" disabled>提交处理</button>
            </div>
            </div>
        </div>

        <!-- 主演示结果（音频播放） -->
        <div class="card result-section" id="audioResultSection" style="display: none;">
            <h2>🎯 翻译语音（主演示结果）</h2>
            <div class="result-card main-result">
                <h3>播放翻译后的语音</h3>
                <div class="audio-player-container">
                    <audio id="resultAudio" controls autoplay></audio>
                </div>
            </div>
        </div>

        <!-- 文本结果（可选显示） -->
        <div class="card result-section" id="textResultSection" style="display: none;">
            <h2>📝 文本结果（可选）</h2>
            <div class="text-result" id="textResults"></div>
        </div>

        <!-- 空状态 -->
        <div class="card" id="emptyState">
            <div class="empty-state">
                <svg fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15c-.08-.49-.49-.85-.98-.85-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>
                </svg>
                <p>点击"开始录音"或上传音频文件开始演示</p>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // 配置加载 - 从服务器获取配置
        // ============================================
        let CONFIG = {
            // 默认配置（加载失败时使用）
            api: {
                url: 'http://localhost:8000',
                endpoint: '/s2st',
                timeout: 30000
            },
            audio: {
                maxFileSize: 100 * 1024 * 1024,
                sampleRate: 16000,
                channels: 1
            },
            response: {
                audioField: 'audio',
                audioType: 'url',
                sourceTextField: 'src_text',
                targetTextField: 'tgt_text'
            },
            ui: {
                showTextResults: true,
                autoPlayAudio: true
            }
        };

        // DOM 元素引用
        const elements = {
            // 配置相关
            configLoading: document.getElementById('configLoading'),
            mainContent: document.getElementById('mainContent'),

            // 输入
            startRecordBtn: document.getElementById('startRecordBtn'),
            stopRecordBtn: document.getElementById('stopRecordBtn'),
            recordStatus: document.getElementById('recordStatus'),
            audioFileInput: document.getElementById('audioFileInput'),
            fileUpload: document.querySelector('.file-upload'),
            fileInfo: document.getElementById('fileInfo'),
            uploadBtn: document.getElementById('uploadBtn'),

            // 结果展示
            emptyState: document.getElementById('emptyState'),
            audioResultSection: document.getElementById('audioResultSection'),
            textResultSection: document.getElementById('textResultSection'),
            resultAudio: document.getElementById('resultAudio'),
            textResults: document.getElementById('textResults')
        };

        // ============================================
        // 页面加载时获取配置
        // ============================================
        async function loadConfig() {
            try {
                const response = await fetch('/config');
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                CONFIG = await response.json();
                console.log('配置加载成功:', CONFIG);
            } catch (error) {
                console.error('配置加载失败，使用默认配置:', error);
                showError('配置加载失败，使用默认配置');
            } finally {
                // 隐藏加载状态，显示主内容
                elements.configLoading.style.display = 'none';
                elements.mainContent.style.display = 'block';
            }
        }

        // 页面加载完成后立即获取配置
        loadConfig();

        // ============================================
        // 全局状态
        // ============================================
        let mediaRecorder = null;
        let audioChunks = [];
        let isRecording = false;

        // ============================================
        // 输入方式切换
        // ============================================
        document.querySelectorAll('.input-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                // 如果正在录音，先停止
                if (isRecording) {
                    stopRecording();
                }

                // 切换标签样式
                document.querySelectorAll('.input-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');

                // 切换面板显示
                document.querySelectorAll('.input-panel').forEach(p => p.classList.remove('active'));
                const panelId = tab.dataset.tab + 'Panel';
                document.getElementById(panelId).classList.add('active');
            });
        });

        // ============================================
        // 麦克风录音功能
        // ============================================
        elements.startRecordBtn.addEventListener('click', async () => {
            try {
                // 请求麦克风权限
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        sampleRate: CONFIG.audio.sampleRate,
                        channelCount: CONFIG.audio.channels
                    }
                });

                // 创建 MediaRecorder
                // 注意：不同浏览器支持的 mimeType 不同，这里使用默认
                const options = {};
                if (MediaRecorder.isTypeSupported('audio/webm')) {
                    options.mimeType = 'audio/webm';
                } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
                    options.mimeType = 'audio/mp4';
                }

                mediaRecorder = new MediaRecorder(stream, options);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    if (event.data.size > 0) {
                        audioChunks.push(event.data);
                    }
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType });
                    await processAudio(audioBlob);

                    // 停止麦克风流
                    stream.getTracks().forEach(track => track.stop());
                };

                // 开始录音
                mediaRecorder.start(100);  // 每 100ms 产生一个数据块
                isRecording = true;

                // 更新 UI 状态
                elements.startRecordBtn.disabled = true;
                elements.stopRecordBtn.disabled = false;
                updateStatus('recording', '<span class="recording-indicator"></span> 正在录音...');

            } catch (error) {
                console.error('录音启动失败:', error);
                showError('无法访问麦克风: ' + error.message);
            }
        });

        elements.stopRecordBtn.addEventListener('click', () => {
            stopRecording();
        });

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;

                elements.startRecordBtn.disabled = false;
                elements.stopRecordBtn.disabled = true;
                updateStatus('processing', '正在处理中...');
            }
        }

        // ============================================
        // 文件上传功能
        // ============================================

        // 文件选择处理
        function handleFileSelect(file) {
            if (!file) return;

            // 检查文件类型
            if (!file.type.startsWith('audio/')) {
                showError('请选择音频文件');
                return;
            }

            // 检查文件大小
            if (file.size > CONFIG.audio.maxFileSize) {
                showError('文件过大，请选择小于 100MB 的文件');
                return;
            }

            // 更新 UI
            elements.fileInfo.textContent = `已选择: ${file.name} (${formatFileSize(file.size)})`;
            elements.uploadBtn.disabled = false;

            // 保存到 input 元素（供上传按钮使用）
            const dataTransfer = new DataTransfer();
            dataTransfer.items.add(file);
            elements.audioFileInput.files = dataTransfer.files;
        }

        // 点击选择文件
        elements.audioFileInput.addEventListener('change', (e) => {
            handleFileSelect(e.target.files[0]);
        });

        // 拖拽上传功能
        if (elements.fileUpload) {
            // 阻止默认拖拽行为
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                elements.fileUpload.addEventListener(eventName, (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                }, false);
            });

            // 拖拽进入和悬停时高亮
            ['dragenter', 'dragover'].forEach(eventName => {
                elements.fileUpload.addEventListener(eventName, () => {
                    elements.fileUpload.classList.add('drag-over');
                }, false);
            });

            // 拖拽离开时移除高亮
            elements.fileUpload.addEventListener('dragleave', () => {
                elements.fileUpload.classList.remove('drag-over');
            }, false);

            // 放置文件时处理
            elements.fileUpload.addEventListener('drop', (e) => {
                elements.fileUpload.classList.remove('drag-over');

                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    handleFileSelect(files[0]);
                }
            }, false);
        }

        // 上传按钮点击事件
        elements.uploadBtn.addEventListener('click', () => {
            const file = elements.audioFileInput.files[0];
            if (file) {
                processAudio(file);
            }
        });

        // ============================================
        // 音频处理与 API 请求（核心逻辑）
        // ============================================
        async function processAudio(audioBlob) {
            // 隐藏空状态，显示处理状态
            hideEmptyState();
            updateStatus('processing', '正在处理中，请稍候...（端到端模型可能需要几秒钟）');

            // 转换为 WAV 格式（确保后端兼容）
            const wavBlob = await convertToWav(audioBlob);

            // 构建 FormData
            const formData = new FormData();
            formData.append('audio', wavBlob, 'input.wav');

            try {
                // 发送请求
                const response = await fetch(
                    `${CONFIG.api.url}${CONFIG.api.endpoint}`,
                    {
                        method: 'POST',
                        body: formData,
                        signal: AbortSignal.timeout(CONFIG.api.timeout)
                    }
                );

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                // 解析响应
                const data = await response.json();
                handleResponse(data);

                updateStatus('idle', '处理完成');

            } catch (error) {
                console.error('处理失败:', error);
                showError('处理失败: ' + error.message);
                updateStatus('idle', '处理失败');
            }
        }

        // ============================================
        // 响应处理（容错设计）
        // ============================================
        function handleResponse(data) {
            // 1. 处理音频结果（核心功能）
            const audioUrl = extractAudioUrl(data);

            if (audioUrl) {
                // 显示音频播放器
                elements.audioResultSection.style.display = 'block';
                elements.resultAudio.src = audioUrl;

                // 尝试自动播放（注意：浏览器可能阻止自动播放）
                elements.resultAudio.play().catch(e => {
                    console.log('自动播放被阻止，用户需手动点击播放');
                });

                updateStatus('playing', '✅ 翻译完成，正在播放...');
            } else {
                console.warn('响应中没有音频字段');
                showError('未收到翻译音频，请检查后端返回格式');
            }

            // 2. 处理文本结果（可选，不显示也不影响核心功能）
            const sourceText = data[CONFIG.response.sourceTextField];
            const targetText = data[CONFIG.response.targetTextField];

            if (sourceText || targetText) {
                displayTextResults(sourceText, targetText);
            } else {
                // 文本缺失是正常的，不显示错误
                console.log('本次响应无文本字段（这是正常情况）');
                elements.textResultSection.style.display = 'none';
            }
        }

        // 提取音频 URL（支持多种格式）
        function extractAudioUrl(data) {
            const audioData = data[CONFIG.response.audioField];

            if (!audioData) {
                return null;
            }

            // 根据 audio_type 处理不同格式
            switch (CONFIG.response.audioType) {
                case 'url':
                    // 直接返回 URL
                    return audioData;

                case 'base64':
                    // Base64 编码的音频
                    if (typeof audioData === 'string') {
                        // 假设是 WAV 格式
                        return `data:audio/wav;base64,${audioData}`;
                    }
                    break;

                case 'binary':
                    // 二进制数据（较少见，通常直接返回文件）
                    console.warn('binary 音频格式需要后端直接返回文件');
                    return null;

                default:
                    console.warn('未知的音频类型:', CONFIG.response.audioType);
                    return null;
            }

            return null;
        }

        // 显示文本结果
        function displayTextResults(sourceText, targetText) {
            elements.textResultSection.style.display = 'block';
            elements.textResults.innerHTML = '';

            if (sourceText) {
                const sourceDiv = createTextItem('原文（识别结果）', sourceText, 'source');
                elements.textResults.appendChild(sourceDiv);
            }

            if (targetText) {
                const targetDiv = createTextItem('译文（翻译结果）', targetText, 'target');
                elements.textResults.appendChild(targetDiv);
            }
        }

        function createTextItem(label, content, type) {
            const div = document.createElement('div');
            div.className = `text-item ${type}`;
            div.innerHTML = `
                <div class="text-label">${label}</div>
                <div class="text-content">${content}</div>
            `;
            return div;
        }

        // ============================================
        // 工具函数
        // ============================================

        // 转换音频为 WAV 格式
        async function convertToWav(blob) {
            const arrayBuffer = await blob.arrayBuffer();
            const audioContext = new AudioContext();
            const audioBuffer = await audioContext.decodeAudioData(arrayBuffer);

            // 重采样到 16kHz 单声道
            const offlineContext = new OfflineAudioContext(
                1,
                audioBuffer.duration * CONFIG.audio.sampleRate,
                CONFIG.audio.sampleRate
            );

            const source = offlineContext.createBufferSource();
            source.buffer = audioBuffer;
            source.connect(offlineContext.destination);
            const renderedBuffer = await offlineContext.startRendering();

            // 编码为 WAV
            return encodeWAV(renderedBuffer);
        }

        function encodeWAV(audioBuffer) {
            const data = audioBuffer.getChannelData(0);
            const sampleRate = audioBuffer.sampleRate;
            const bitDepth = 16;
            const bytesPerSample = bitDepth / 8;
            const dataLength = data.length * bytesPerSample;
            const bufferLength = 44 + dataLength;

            const arrayBuffer = new ArrayBuffer(bufferLength);
            const view = new DataView(arrayBuffer);

            // WAV 头
            writeString(view, 0, 'RIFF');
            view.setUint32(4, 36 + dataLength, true);
            writeString(view, 8, 'WAVE');
            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);  // PCM
            view.setUint16(22, 1, true);  // 单声道
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, bitDepth, true);
            writeString(view, 36, 'data');
            view.setUint32(40, dataLength, true);

            // 写入音频数据
            let offset = 44;
            for (let i = 0; i < data.length; i++) {
                const sample = Math.max(-1, Math.min(1, data[i]));
                view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7FFF, true);
                offset += 2;
            }

            return new Blob([arrayBuffer], { type: 'audio/wav' });
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        // 更新状态显示
        function updateStatus(state, html) {
            elements.recordStatus.className = `status ${state}`;
            elements.recordStatus.innerHTML = html;
        }

        // 隐藏空状态
        function hideEmptyState() {
            elements.emptyState.style.display = 'none';
        }

        // 格式化文件大小
        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        // 显示错误消息
        function showError(message) {
            // 移除旧错误
            const oldError = document.querySelector('.error-message');
            if (oldError) oldError.remove();

            // 创建新错误
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.innerHTML = `<span>⚠️</span><span>${message}</span>`;

            // 插入到结果区域之前
            const container = document.querySelector('.container');
            container.insertBefore(errorDiv, elements.emptyState);

            // 5 秒后自动移除
            setTimeout(() => {
                errorDiv.remove();
            }, 5000);
        }
    </script>
</body>
</html>
